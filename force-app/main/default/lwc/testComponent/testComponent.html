<template>
    <h1>{message}</h1>
    <h2>{stepName}</h2>
    <div class="slds-p-around_medium"> <lightning-input type="toggle" label="Enable Setting" checked={value}
            onchange={handleToggleChange}> </lightning-input> </div>
    <div class="slds-p-around_medium"> <lightning-input label="First Name" type="text"></lightning-input>
        <lightning-input label="Last Name" type="text"></lightning-input> </div>
    <div class="slds-p-around_medium"> <lightning-button label="Navigate to Next" variant="brand"
            onclick={handleNext}></lightning-button> </div>
</template>
